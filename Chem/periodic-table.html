<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Periodic Table | Chemistry</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600&family=Montserrat:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #ABC4B0;
            --bg: #0a0c0b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg);
            color: #fff;
            font-family: 'Instrument Sans', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid rgba(171, 196, 176, 0.1);
        }

        .back-btn {
            color: var(--accent);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 600;
            transition: opacity 0.2s;
        }

        .back-btn:hover {
            opacity: 0.8;
        }

        .title {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.2rem;
            letter-spacing: 1px;
            color: var(--accent);
        }

        .iframe-container {
            flex: 1;
            width: 100%;
            position: relative;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            filter: invert(0.9) hue-rotate(140deg) brightness(1.1); /* Attempt to match the dark theme */
        }

        /* Loading state */
        .loader {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            z-index: -1;
        }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="back-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            Back to Hub
        </a>
        <div class="title">PERIODIC TABLE</div>
        <div style="width: 100px;"></div> <!-- Spacer -->
    </header>

    <div class="iframe-container">
        <div class="loader">Loading PubChem Data...</div>
        <iframe 
            src="https://pubchem.ncbi.nlm.nih.gov/periodic-table/#view=table&embed=true" 
            title="PubChem Periodic Table">
        </iframe>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arc Reactor Prototype</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050505;
            color: #ABC4B0;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        canvas {
            display: block;
        }
        #ui {
            position: absolute;
            bottom: 2rem;
            text-align: center;
            pointer-events: none;
        }
        h1 {
            font-size: 1.2rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
            opacity: 0.8;
        }
        .status {
            font-size: 0.9rem;
            color: #4B6B54;
            letter-spacing: 0.1em;
        }
        #controls {
            position: absolute;
            top: 2rem;
            left: 2rem;
            display: flex;
            gap: 1rem;
            pointer-events: auto;
        }
        button {
            background: rgba(171, 196, 176, 0.1);
            border: 1px solid rgba(171, 196, 176, 0.3);
            color: #ABC4B0;
            padding: 0.8rem 1.2rem;
            border-radius: 0.4rem;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.3s;
        }
        button:hover {
            background: rgba(171, 196, 176, 0.2);
            border-color: #ABC4B0;
        }
        button.active {
            background: rgba(228, 79, 25, 0.2);
            border-color: #e44f19;
            color: #e44f19;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="arc_reactor.js"></script>
</body>
</html>
